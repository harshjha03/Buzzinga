<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F0A400" id="themeColor">
<title>Buzzinga</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@googlemaps/markerclusterer@2.5.3/dist/index.min.js" defer></script>
<style>
/* ---- tokens (design handoff README) ---- */
:root{
  --amber:#F0A400; --amber-hi:#F8B31A; --ink:#201D18; --bg:#F7F3EC; --card:#FFFDF8;
  --map:#EFE9DA; --dark:#14110B; --ondark:#F5EFE3; --amber-dark:#8A5B00;
  --green:#2C7A4B; --green-strong:#22603B; --green-tint:#E2EFE2; --green-dark:#8FD9A8;
  --red-dark:#E06A54; --red-light:#BA3A24;
  --hair:rgba(32,29,24,.1); --hair-d:rgba(245,239,227,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);font-family:'Instrument Sans',system-ui,sans-serif;color:var(--ink);overscroll-behavior:none}
#app{height:100%;max-width:480px;margin:0 auto;overflow:hidden;position:relative}
.eyebrow{font:600 9.5px 'Archivo',sans-serif;letter-spacing:.12em;color:rgba(32,29,24,.45);text-transform:uppercase}
.eyebrow-d{font:600 10.5px 'Archivo',sans-serif;letter-spacing:.16em;color:rgba(245,239,227,.5);text-transform:uppercase}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:16px;cursor:pointer;user-select:none;transition:background .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn-amber{background:var(--amber);box-shadow:0 8px 20px -8px rgba(240,164,0,.7)}
.btn-amber:hover{background:var(--amber-hi)}
.card{background:var(--card);border:1px solid var(--hair);border-radius:16px}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;
  padding-top:calc(14px + env(safe-area-inset-top))}
.tabnum{font-variant-numeric:tabular-nums}
input[type=range]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;margin:0}
/* ---- motion (design handoff README) ---- */
@keyframes bz-pulse{0%{transform:scale(1);opacity:.5}70%{transform:scale(2.4);opacity:0}100%{transform:scale(2.4);opacity:0}}
@keyframes bz-charge{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes bz-rise{from{transform:translateY(44px);opacity:0}to{transform:none;opacity:1}}
@keyframes bz-drop{from{transform:translateY(-26px);opacity:0}to{transform:none;opacity:1}}
@keyframes bz-fade{from{opacity:0}to{opacity:1}}
@keyframes bz-pop{0%{transform:scale(.85);opacity:0}65%{transform:scale(1.05);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes bz-flashout{from{opacity:1}to{opacity:0}}
@keyframes bz-draw{from{stroke-dashoffset:700}to{stroke-dashoffset:0}}
@keyframes bz-boltin{from{transform:scale(1.2);opacity:0}to{transform:scale(1);opacity:.9}}
.rise{animation:bz-rise .55s cubic-bezier(.2,.8,.2,1) both}
.drop{animation:bz-drop .5s cubic-bezier(.2,.8,.2,1) both}
.pop{animation:bz-pop .55s cubic-bezier(.2,.8,.2,1) both}
/* modal */
#modal{position:absolute;inset:0;background:rgba(32,29,24,.45);display:flex;align-items:flex-end;z-index:40;animation:bz-fade .2s both}
#modal .sheet{background:var(--bg);border-radius:22px 22px 0 0;width:100%;max-height:78%;display:flex;flex-direction:column;padding:18px 18px 30px;animation:bz-rise .4s cubic-bezier(.2,.8,.2,1) both}
.vrow{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border:1px solid var(--hair);border-radius:14px;background:var(--card);cursor:pointer;margin-bottom:8px}
.vrow:hover{border-color:rgba(32,29,24,.3)}
.badge{font:700 9px 'Archivo',sans-serif;letter-spacing:.08em;padding:3px 7px;border-radius:999px}
.badge-t1{background:var(--green-tint);color:var(--green-strong)}
.badge-t2{background:rgba(240,164,0,.14);color:var(--amber-dark)}
.field{font:600 15px 'Instrument Sans',sans-serif;border:none;background:none;outline:none;color:var(--ink);width:100%;padding:0}
/* map */
#map{position:absolute;inset:0}
.gm-iw .pn{font:700 13px 'Instrument Sans',sans-serif;color:#201D18}
.gm-iw .pm{font:400 11px 'Instrument Sans',sans-serif;color:rgba(32,29,24,.6);margin-top:2px}
.locate-btn{position:absolute;right:12px;bottom:34px;z-index:5;width:42px;height:42px;border-radius:50%;
  background:var(--card);border:1px solid var(--hair);box-shadow:0 4px 14px -4px rgba(32,29,24,.3);
  display:flex;align-items:center;justify-content:center;cursor:pointer}
.locate-btn:active{transform:scale(.94)}
.rowbtn{flex:none;width:30px;height:30px;border-radius:10px;background:var(--chipbg);
  display:flex;align-items:center;justify-content:center;cursor:pointer}
.rowbtn:active{transform:scale(.92)}
.locate-btn.on,.rowbtn.on{background:var(--amber);border-color:var(--amber);
  box-shadow:0 0 0 4px rgba(240,164,0,.25)}
#pinChip{position:absolute;left:50%;transform:translateX(-50%);bottom:32px;z-index:6;
  display:flex;align-items:center;gap:10px;padding:9px 12px 9px 14px;border-radius:999px;
  background:var(--card);border:1px solid var(--hair);box-shadow:0 8px 24px -8px rgba(32,29,24,.35);
  white-space:nowrap;animation:bz-rise .3s cubic-bezier(.2,.8,.2,1) both}
.pin-act{font:700 12.5px 'Instrument Sans',sans-serif;color:var(--amber-dark);cursor:pointer;
  padding:5px 10px;border-radius:999px;background:rgba(240,164,0,.12)}
.pin-act:active{transform:scale(.95)}
.pin-x{font:600 12px 'Instrument Sans',sans-serif;color:rgba(32,29,24,.45);cursor:pointer;padding:4px 6px}
.locate-btn.on svg *,.rowbtn.on svg *{stroke:#201D18;fill-opacity:1}
.locate-btn.on svg circle[fill],.rowbtn.on svg circle[fill]{fill:#201D18}
/* autocomplete */
.ac-wrap{position:relative}
.ac-list{position:absolute;left:-16px;right:-16px;top:calc(100% + 8px);background:var(--card);border:1px solid var(--hair);border-radius:14px;box-shadow:0 10px 28px -8px rgba(32,29,24,.25);z-index:30;overflow:hidden}
@keyframes bz-coach{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.ac-row{padding:10px 16px;cursor:pointer}
.ac-row:hover,.ac-row.hot{background:var(--hover)}
.ac-row .m{font:600 13.5px 'Instrument Sans',sans-serif}
.ac-row .s{font:400 11px 'Instrument Sans',sans-serif;color:rgba(32,29,24,.5)}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
const API = '';   // same origin
const $ = (id) => document.getElementById(id);
const app = $('app');

/* ---------- svg bits ---------- */
const HEX_LOGO = (s) => `<svg width="${s}" height="${s}" viewBox="0 0 22 22"><path d="M11 1 L19.6 6 L19.6 16 L11 21 L2.4 16 L2.4 6 Z" fill="#F0A400"/><path d="M12.2 5.5 L8 12 L10.8 12 L9.8 16.5 L14 10 L11.2 10 Z" fill="#201D18"/></svg>`;
const BOLT = (w,h,fill) => `<svg width="${w}" height="${h}" viewBox="0 0 11 14"><path d="M6.5 0 L0 8 L4 8 L3 14 L11 5.5 L6.5 5.5 Z" fill="${fill}"/></svg>`;
/* ---------- real map (Google Maps JS + live charger pins) ---------- */
const mapHost = document.createElement('div');
mapHost.id = 'map';
let map = null, userMarker = null, userPos = null, infoWin = null,
    clusterer = null, markers = [], gmapsRequested = false, tmMap = null;

const WARM_STYLE = [   // tone Google's palette toward the brand's paper world
  { featureType: 'poi', stylers: [{ visibility: 'off' }] },
  { featureType: 'transit', stylers: [{ visibility: 'off' }] },
  { featureType: 'road', elementType: 'labels.icon', stylers: [{ visibility: 'off' }] },
  { featureType: 'landscape', stylers: [{ saturation: -25 }, { lightness: 8 }] },
  { featureType: 'water', stylers: [{ saturation: -30 }, { lightness: 10 }] },
];

function loadGmaps() {
  if (window.google?.maps || gmapsRequested) return;
  gmapsRequested = true;
  fetch(API + '/config').then(r => r.json()).then(c => {
    const s = document.createElement('script');
    s.src = `https://maps.googleapis.com/maps/api/js?key=${c.maps_js_key}&v=weekly&loading=async&callback=__gmReady`;
    document.head.appendChild(s);
  }).catch(() => { gmapsRequested = false; });
}
window.__gmReady = () => { if ($('mapSlot')) mountMap(); };

function ensureMap() {
  if (map || !window.google?.maps) return;
  map = new google.maps.Map(mapHost, {
    center: userPos || { lat: 12.97, lng: 77.59 }, zoom: 11,
    disableDefaultUI: true, zoomControl: false, clickableIcons: false, maxZoom: 21,
    styles: WARM_STYLE, gestureHandling: 'greedy',
  });
  infoWin = new google.maps.InfoWindow();
  map.addListener('idle', () => {
    lastView = { center: map.getCenter(), zoom: map.getZoom() };
    loadChargers();
  });
  map.addListener('dragstart', () => { following = false; });  // user takes the wheel
  map.addListener('click', (e) => dropPin(e.latLng));
  placeUserMarker();
}
/* --- pick a location by pin --- */
let pickMarker = null;
function dropPin(latLng) {
  if (!pickMarker) {
    pickMarker = new google.maps.Marker({ map, position: latLng, draggable: true,
      animation: google.maps.Animation.DROP, zIndex: 998 });
    pickMarker.addListener('dragend', () => showPinChip());
  } else pickMarker.setPosition(latLng);
  showPinChip();
}
function showPinChip() {
  let chip = $('pinChip');
  if (!chip) {
    const slot = $('mapSlot');
    if (!slot) return;
    chip = document.createElement('div');
    chip.id = 'pinChip';
    slot.parentElement.appendChild(chip);
  }
  chip.innerHTML = `
    <span style="font:600 12px 'Instrument Sans',sans-serif;color:rgba(32,29,24,.65)">Pinned point —</span>
    <span class="pin-act" onclick="usePin('from')">Start here</span>
    <span class="pin-act" onclick="usePin('to')">Go here</span>
    <span class="pin-x" onclick="clearPin()" role="button" aria-label="Dismiss pin">✕</span>`;
}
function clearPin() {
  if (pickMarker) { pickMarker.setMap(null); pickMarker = null; }
  const chip = $('pinChip'); if (chip) chip.remove();
}
async function usePin(which) {
  if (!pickMarker) return;
  const p = pickMarker.getPosition();
  const at = `${p.lat().toFixed(6)},${p.lng().toFixed(6)}`;
  let label = `Pinned (${p.lat().toFixed(4)}, ${p.lng().toFixed(4)})`;
  try {
    const r = await fetch(`${API}/geo/reverse?at=${at}`);
    const d = await r.json();
    if (d.label) label = d.label.split(',').slice(0, 3).join(',');
  } catch (e) { /* coords label is fine */ }
  if (which === 'from') S.from = { label, value: at };
  else S.to = { label, value: at };
  clearPin();
  render();
}
let lastView = null;

let chargersBusy = false, chargersLoaded = false;
async function loadChargers() {
  // all-India, fetched once — the clusterer keeps every zoom level readable
  if (!map || chargersBusy || chargersLoaded) return;
  chargersBusy = true;
  try {
    const r = await fetch(`${API}/chargers?bbox=6.5,68.0,36.0,97.5`);
    const data = await r.json();
    clearMarkers();
    markers = data.chargers.map(c => {
      const kw = Math.max(0, ...c.stalls.filter(s => s.current_type === 'DC').map(s => s.power_kw || 0));
      const dcfast = kw >= 24;
      const m = new google.maps.Marker({
        position: { lat: c.lat, lng: c.lon },
        icon: { path: google.maps.SymbolPath.CIRCLE, scale: dcfast ? 8 : 5,
                fillColor: dcfast ? '#F0A400' : '#8C877D', fillOpacity: dcfast ? 1 : .7,
                strokeColor: '#FFFDF8', strokeWeight: 1.6 },
        title: c.name,
      });
      m.addListener('click', () => {
        infoWin.setContent(`<div class="gm-iw"><div class="pn">${c.name}</div><div class="pm">${c.operator || ''}${kw ? ` · ${Math.round(kw)} kW DC` : ' · AC only'}${c.last_verified_at ? ` · verified ${c.last_verified_at.slice(0, 10)}` : ''}</div></div>`);
        infoWin.open({ map, anchor: m });
      });
      return m;
    });
    if (window.markerClusterer?.MarkerClusterer) {
      clusterer = new markerClusterer.MarkerClusterer({ map, markers,
        renderer: { render: ({ count, position }) => new google.maps.Marker({
          position, zIndex: 10 + count,
          icon: { path: google.maps.SymbolPath.CIRCLE, scale: count > 50 ? 20 : count > 10 ? 16 : 13,
                  fillColor: '#F0A400', fillOpacity: 1, strokeColor: '#FFFDF8', strokeWeight: 2 },
          label: { text: String(count), color: '#201D18', fontSize: '11px', fontWeight: '700' },
        })}});
    } else markers.forEach(m => m.setMap(map));
    chargersLoaded = true;
  } catch (e) { /* transient — next idle retries */ }
  chargersBusy = false;
}
function clearMarkers() {
  if (clusterer) { clusterer.clearMarkers(); clusterer = null; }
  markers.forEach(m => m.setMap(null));
  markers = [];
}
function placeUserMarker() {
  if (!map || !userPos) return;
  const pos = { lat: userPos[1], lng: userPos[0] };
  if (!userMarker) {
    userMarker = new google.maps.Marker({ map, position: pos, zIndex: 999,
      icon: { path: google.maps.SymbolPath.CIRCLE, scale: 8, fillColor: '#4285F4',
              fillOpacity: 1, strokeColor: '#FFFFFF', strokeWeight: 3 } });
    map.panTo(pos); map.setZoom(12);
  } else userMarker.setPosition(pos);
}
/* ---------- GPS trace (locate button = toggle) ---------- */
let watchId = null, following = false, accCircle = null;
function applyFix(p, pan) {
  userPos = [p.coords.longitude, p.coords.latitude];
  S.from = { label: 'Current location', value: `${p.coords.latitude.toFixed(6)},${p.coords.longitude.toFixed(6)}` };
  placeUserMarker();
  drawAccuracy(p.coords.accuracy);
  const fi = $('fromInput');
  if (fi && document.activeElement !== fi) fi.value = 'Current location';
  if (pan && map) {
    map.panTo({ lat: userPos[1], lng: userPos[0] });
    if (zoomOnFix) { map.setZoom(16); zoomOnFix = false; }  // close-in street view
  }
}
let zoomOnFix = false;
function locateMe() {
  if (watchId !== null) { stopTrace(); return; }
  if (!navigator.geolocation) { S.planError = 'Location is not available on this device.'; render(); return; }
  following = true;
  zoomOnFix = true;   // first fix frames a ~1 km radius around you
  setLocBtn(true);
  // this call raises the browser + OS location permission prompt
  watchId = navigator.geolocation.watchPosition(
    (p) => applyFix(p, following),
    (err) => {
      stopTrace();
      S.planError = err.code === 1
        ? 'Location permission denied — allow it for this site in your browser (and in System Settings → Privacy → Location Services), or type a starting point.'
        : 'Couldn’t get a GPS fix — try again with a clearer sky view, or type a starting point.';
      render();
    },
    { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
}
function stopTrace() {
  if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  following = false;
  setLocBtn(false);
  if (accCircle) { accCircle.setMap(null); accCircle = null; }
}
function drawAccuracy(accM) {
  if (!map || !userPos || !window.google?.maps || watchId === null) return;
  const c = { lat: userPos[1], lng: userPos[0] };
  if (!accCircle) accCircle = new google.maps.Circle({ map, center: c, radius: accM,
    fillColor: '#4285F4', fillOpacity: .12, strokeColor: '#4285F4', strokeOpacity: .35, strokeWeight: 1 });
  else { accCircle.setCenter(c); accCircle.setRadius(accM); }
}
function setLocBtn(on) {
  document.querySelectorAll('.locate-btn, .rowbtn').forEach(b => b.classList.toggle('on', on));
}
function mountMap() {
  const slot = $('mapSlot');
  if (!slot) return;
  slot.appendChild(mapHost);
  if (!window.google?.maps) { loadGmaps(); tmMap = setTimeout(mountMap, 350); return; }
  // wait one frame so the slot has real layout height before the map
  // measures itself (a 0-height init leaves the top of the canvas blank)
  requestAnimationFrame(() => {
    if (!$('mapSlot')) return;
    ensureMap();
    if (!map) return;
    google.maps.event.trigger(map, 'resize');
    if (lastView) { map.setCenter(lastView.center); map.setZoom(lastView.zoom); }
    else if (userPos) map.setCenter({ lat: userPos[1], lng: userPos[0] });
  });
}
addEventListener('resize', () => { if (map && $('mapSlot')) {
  google.maps.event.trigger(map, 'resize');
  if (lastView) map.setCenter(lastView.center);
}});

/* ---------- state ---------- */
const S = {
  screen: 'splash',
  vehicles: [], vehicle: null,
  from: { label: 'Current location', value: '' },   // value = "lat,lng" or text
  to: { label: '', value: '' },
  soc: 78, planning: false, planError: null,
  plan: null, legs: [], stops: [],
  pinned: null, swapOpen: null, swapBusy: false, swapError: null, // stop customization
  legIndex: 0, kmLeft: 0, socNow: 0, chargePct: 0, kmDone: 0, gpsLive: false,
  demo: false,
  checkin: null, checkinTrust: null,
  saved: JSON.parse(localStorage.getItem('bz_saved') || 'null'),
};
let tm = null;
const clearAll = () => clearTimeout(tm);
const fmtClock = (d) => d.toLocaleTimeString('en-IN', {hour:'numeric', minute:'2-digit'}).replace(/\s?(am|pm)/i, (m)=>' '+m.trim().toUpperCase());
const fmtDur = (min) => min >= 60 ? `${Math.floor(min/60)} h ${String(Math.round(min%60)).padStart(2,'0')} m` : `${Math.round(min)} m`;

function setScreen(s, push = true) {
  S.screen = s;
  if (s !== 'intrip' && typeof stopTripTrace === 'function') stopTripTrace();
  $('themeColor').content = ['intrip','charging','freetogo'].includes(s) ? '#14110B'
    : s === 'splash' ? '#F0A400' : '#F7F3EC';
  render();
}

/* ---------- data ---------- */
async function loadVehicles() {
  const r = await fetch(API + '/vehicles');
  S.vehicles = (await r.json()).vehicles;
  const savedId = localStorage.getItem('bz_vehicle');
  S.vehicle = S.vehicles.find(v => v.id === savedId) || S.vehicles[0];
  if (S.screen === 'home') render();
}
function locate() {   // one passive fix at startup — no error UI, no tracking
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(p => {
    applyFix(p, false);
    if (S.screen === 'home' && document.activeElement.tagName !== 'INPUT') render();
  }, () => {}, { timeout: 8000 });
}

/* ---------- Places autocomplete (proxied — key stays server-side) ---------- */
let acTm = null, acFor = null;
function acInput(which, el) {
  const q = el.value.trim();
  if (which === 'from') S.from = { label: el.value, value: el.value };
  else S.to = { label: el.value, value: el.value };
  clearTimeout(acTm);
  if (q.length < 2) { acClose(); return; }
  acTm = setTimeout(async () => {
    try {
      const near = userPos ? `&near=${userPos[1]},${userPos[0]}` : '';
      const r = await fetch(`${API}/geo/autocomplete?q=${encodeURIComponent(q)}${near}`);
      const d = await r.json();
      acShow(which, el, d.suggestions || []);
    } catch (e) { acClose(); }
  }, 220);
}
function acShow(which, el, sug) {
  acClose();
  if (!sug.length) return;
  acFor = which;
  const list = document.createElement('div');
  list.className = 'ac-list'; list.id = 'acList';
  list.innerHTML = sug.slice(0, 5).map((s, i) =>
    `<div class="ac-row" data-i="${i}"><div class="m">${s.main}</div>${s.secondary ? `<div class="s">${s.secondary}</div>` : ''}</div>`).join('');
  list.onmousedown = (e) => {   // mousedown beats input blur
    const row = e.target.closest('.ac-row');
    if (!row) return;
    const s = sug[+row.dataset.i];
    const sel = { label: s.secondary ? `${s.main}, ${s.secondary.split(',')[0]}` : s.main,
                  value: s.place_id ? 'place_id:' + s.place_id : s.main };
    if (which === 'from') S.from = sel; else S.to = sel;
    acClose(); render();
  };
  el.closest('.ac-wrap').appendChild(list);
}
function acClose() { const l = $('acList'); if (l) l.remove(); acFor = null; }

async function doPlan() {
  if (S.planning) return;
  const dest = S.to.value.trim();
  if (!dest) { S.planError = 'Where to? Tap the TO row to type a destination.'; render(); return; }
  S.planning = true; S.planError = null;
  S.pinned = null; S.swapOpen = null; S.swapError = null; // fresh plan = auto stops
  render();
  try {
    const r = await fetch(API + '/route/plan', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        origin: S.from.value || S.from.label, destination: dest,
        vehicle_id: S.vehicle.id, soc: S.soc,
      }),
    });
    if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
    const p = await r.json();
    S.plan = p; S.planning = false;
    if (!p.feasible) { S.planError = p.reason; render(); return; }
    buildLegs(p);
    setScreen('itinerary');
  } catch (e) {
    S.planning = false; S.planError = String(e.message || e); render();
  }
}

function buildLegs(p) {
  // itinerary nodes: origin -> stops -> destination
  S.stops = p.stops;
  const legs = [];
  let prevOff = 0, prevSoc = p.start_soc;
  p.stops.forEach((st, i) => {
    legs.push({ name: st.name, km: st.offset_km - prevOff, cum: prevOff,
                startSoc: prevSoc, arrive: st.arrive_soc,
                planB: st.plan_b ? st.plan_b.name : null, lat: st.lat, lon: st.lon, stop: st });
    prevOff = st.offset_km; prevSoc = st.depart_soc;
  });
  legs.push({ name: S.to.label || S.to.value, km: p.distance_km - prevOff, cum: prevOff,
              startSoc: prevSoc, arrive: p.arrive_soc, final: true,
              planB: p.stops.length ? (p.stops[p.stops.length-1].plan_b || {}).name : null });
  S.legs = legs;
}

/* customize stops: re-solve with the user's charger picks — SoC targets,
   charge minutes and totals all recompute server-side (gather is cached,
   so no extra Google spend) */
async function replanWith(ids) {
  if (S.swapBusy) return;
  S.swapBusy = true; S.swapError = null; render();
  try {
    const r = await fetch(API + '/route/plan', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        origin: S.from.value || S.from.label, destination: S.to.value.trim(),
        vehicle_id: S.vehicle.id, soc: S.soc, charger_ids: ids,
      }),
    });
    const p = await r.json();
    if (!r.ok) throw new Error(p.detail || r.statusText);
    if (!p.feasible) { S.swapError = p.reason; }
    else { S.plan = p; S.pinned = ids; S.swapOpen = null; buildLegs(p); }
  } catch (e) { S.swapError = String(e.message || e); }
  S.swapBusy = false; render();
}
function swapStop(i, altId) {
  const ids = S.plan.stops.map(s => s.charger_id);
  ids[i] = altId;
  replanWith(ids);
}
function toggleSwap(i) { S.swapOpen = S.swapOpen === i ? null : i; S.swapError = null; render(); }

async function sendCheckin(result, label) {
  const last = S.stops[S.stops.length - 1];
  S.checkin = label; render();
  try {
    const r = await fetch(`${API}/chargers/${last.charger_id}/checkin`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ result }),
    });
    if (r.ok) { S.checkinTrust = (await r.json()).trust; render(); }
  } catch (e) { /* logged locally regardless */ }
}

/* ---------- trip flow (pilot mode: every transition is a driver action,
   nothing auto-plays; the plan's numbers are shown as the reference) ---------- */
function startLeg(i) {
  clearAll();
  const leg = S.legs[i];
  S.legIndex = i; S.kmLeft = leg.km; S.socNow = leg.startSoc;
  startTripTrace();
  setScreen('intrip');
}

/* live trip tracking: GPS fixes -> distance done -> SoC decay along the
   planner's own leg profile (startSoc -> arrive over leg.km). If GPS is
   unavailable (needs HTTPS off-localhost) the planned numbers just stay. */
let tripWatch = null, tripLast = null;
const havKm = (a, b) => {
  const r = Math.PI / 180, dla = (b[0] - a[0]) * r, dlo = (b[1] - a[1]) * r;
  const h = Math.sin(dla / 2) ** 2
    + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dlo / 2) ** 2;
  return 12742 * Math.asin(Math.sqrt(h));
};
function startTripTrace() {
  stopTripTrace();
  S.kmDone = 0; S.gpsLive = false;
  if (S.demo) { demoDrive(); return; }   // demo fakes the drive, no GPS
  if (!navigator.geolocation) return;
  tripWatch = navigator.geolocation.watchPosition(onTripFix, () => {},
    { enableHighAccuracy: true, maximumAge: 2000, timeout: 30000 });
}
function stopTripTrace() {
  if (tripWatch !== null) { navigator.geolocation.clearWatch(tripWatch); tripWatch = null; }
  tripLast = null;
}
function onTripFix(p) {
  const { latitude, longitude, accuracy } = p.coords;
  S.gpsLive = true;
  if (tripLast) {
    const dKm = havKm(tripLast, [latitude, longitude]);
    // ignore GPS jitter: move must beat 15 m and half the fix accuracy
    if (dKm * 1000 >= Math.max(15, (accuracy || 0) / 2)) {
      S.kmDone += dKm; tripLast = [latitude, longitude];
    }
  } else tripLast = [latitude, longitude];
  updateTripLive();
}
function updateTripLive() {
  const leg = S.legs[S.legIndex];
  if (!leg || S.screen !== 'intrip') return;
  const done = Math.min(S.kmDone, leg.km);
  S.kmLeft = leg.km - done;
  S.socNow = leg.km ? leg.startSoc - done / leg.km * (leg.startSoc - leg.arrive) : leg.startSoc;
  if ($('liveKm')) $('liveKm').textContent = `${Math.round(S.kmLeft)} km`;
  if ($('liveEta')) $('liveEta').textContent = fmtDur(S.kmLeft / 85 * 60);
  if ($('liveLine')) $('liveLine').textContent = tripLiveText();
  const dot = $('tripDot');
  if (dot && S.plan) {
    dot.setAttribute('cx', ((leg.cum + done) / S.plan.distance_km * 358).toFixed(1));
    dot.setAttribute('cy', (64 - S.socNow * 0.525).toFixed(1));
  }
}
const tripLiveText = () => S.gpsLive
  ? `${S.demo ? 'demo drive' : 'live GPS'} · ${Math.min(S.kmDone, S.legs[S.legIndex].km).toFixed(1)} km done · battery now ~${Math.round(S.socNow)}%`
  : 'waiting for GPS fix…';
function startCharge(i) {
  clearAll();
  const st = S.stops[i];
  S.legIndex = i; S.chargePct = st.arrive_soc; S.socNow = st.arrive_soc;
  setScreen('charging');
}
function arrivedAtLegEnd() {
  const leg = S.legs[S.legIndex];
  if (leg.final) { S.socNow = leg.arrive; setScreen('arrival'); }
  else startCharge(S.legIndex);
}

/* ---------- demo walkthrough (EV badge, top right): a scripted tour that
   plans a real trip and auto-plays drive -> charge -> arrival. Pilot mode's
   no-auto-play rule applies to real trips; the demo is explicitly a demo. */
let demoT = [];
const demoStep = (ms, fn) => demoT.push(setTimeout(() => { if (S.demo) fn(); }, ms));
function stopDemo(goHome = true) {
  demoT.forEach(t => { clearTimeout(t); clearInterval(t); });
  demoT = [];
  uncoach();
  if (!S.demo) return;
  S.demo = false;
  stopTripTrace();
  if (goHome) { S.plan = null; S.planError = null; S.swapOpen = null; setScreen('home'); }
}

/* coach mark: amber ring around the target + dimmed everything else
   (the giant box-shadow is clipped by #app's overflow:hidden) */
function uncoach() { const c = $('coach'); if (c) c.remove(); }
function coach(sel, text) {
  uncoach();
  const t = document.querySelector(sel);
  if (!t) return;
  t.scrollIntoView({ block: 'center', behavior: 'instant' });
  const a = app.getBoundingClientRect(), r = t.getBoundingClientRect(), pad = 6;
  const top = r.top - a.top - pad, left = r.left - a.left - pad,
        w = r.width + pad * 2, h = r.height + pad * 2;
  const bubbleBelow = (top + h) < a.height * 0.62;   // bubble on the roomier side
  const div = document.createElement('div');
  div.id = 'coach';
  div.style.cssText = 'position:absolute;inset:0;z-index:97;pointer-events:none';
  div.innerHTML = `
    <div style="position:absolute;top:${top}px;left:${Math.max(4, left)}px;width:${Math.min(w, a.width - 8)}px;height:${h}px;border-radius:16px;border:2.5px solid var(--amber);box-shadow:0 0 0 2000px rgba(20,17,11,.55);animation:bz-coach .35s ease both"></div>
    <div style="position:absolute;${bubbleBelow ? `top:${top + h + 12}px` : `bottom:${a.height - top + 12}px`};left:16px;right:16px;display:flex;justify-content:center;animation:bz-coach .35s ease both">
      <span style="max-width:310px;padding:11px 15px;border-radius:14px;background:var(--amber);color:#201D18;font:600 13px/1.45 'Instrument Sans',sans-serif;box-shadow:0 12px 30px -8px rgba(0,0,0,.45)">${text}</span>
    </div>`;
  app.appendChild(div);
}

async function startDemo() {
  stopDemo(false);
  if (!S.vehicle) return;   // catalog still loading
  S.demo = true;
  S.from = { label: 'Bengaluru', value: 'Bengaluru' };
  S.to = { label: 'Chennai, Tamil Nadu', value: 'Chennai' };
  S.soc = 45;
  S.vehicle = S.vehicles.find(v => v.tier === 1) || S.vehicle;
  setScreen('home');
  const C = 3200; let t = 800;   // one beat per callout
  demoStep(t, () => coach('#fromInput', 'Start here — search a place, tap the crosshair for GPS, or long-press a pin on the map.'));
  demoStep(t += C, () => coach('#toInput', 'Where you’re headed — type and pick a suggestion.'));
  demoStep(t += C, () => coach('#vehCard', 'Your EV — tap to change. Real full-charge range shows here.'));
  demoStep(t += C, () => coach('#socBlock', 'Drag to today’s battery % — the plan starts from this.'));
  demoStep(t += C, () => coach('#planBtn', 'That’s all Buzzinga needs. Tap to plan chargers, charge levels and timing.'));
  demoStep(t += C, async () => {
    uncoach();
    await doPlan();
    if (!S.demo) return;
    if (!S.plan || !S.plan.feasible) { stopDemo(); return; }
    demoItinerary();
  });
}
function demoItinerary() {
  const C = 3400; let t = 900;
  demoStep(t, () => coach('#arriveBig', 'Your promise: arrival time and battery on arrival, from real charger data.'));
  if (S.plan.stops.length) {
    demoStep(t += C, () => coach('#stop0', 'A charge stop: arrive %, charge-to %, minutes, and a reliability score.'));
    demoStep(t += C, () => coach('[onclick="toggleSwap(0)"]', 'Prefer another charger? Swap it — battery and timing recompute instantly.'));
  }
  demoStep(t += C, () => coach('#startTripBtn', 'Rolling out? Tap Start trip.'));
  demoStep(t += C, () => { uncoach(); startLeg(0); demoIntrip(); });
}
function demoIntrip() {
  demoStep(900, () => coach('#liveLine', 'On the road, GPS tracks distance done and battery decay live.'));
  demoStep(4300, () => coach('#arrivedBtn', 'At the charger, plugged in? Tell the app here.'));
  demoStep(7400, () => uncoach());
}
function demoDrive() {
  const leg = S.legs[S.legIndex];
  S.gpsLive = true;
  const iv = setInterval(() => {
    if (!S.demo || S.screen !== 'intrip') { clearInterval(iv); return; }
    S.kmDone += leg.km / 44;             // ~11 s per leg, room for callouts
    updateTripLive();
    if (S.kmDone >= leg.km) {
      clearInterval(iv);
      demoStep(1100, () => { arrivedAtLegEnd(); demoAfterArrive(); });
    }
  }, 250);
  demoT.push(iv);
}
function demoAfterArrive() {
  if (S.screen === 'charging') {
    demoStep(800, () => coach('#chargeTarget', 'Charge only to the target — charging slows past 80%, so this is the fastest plan.'));
    demoStep(4200, () => coach('#chargeDone', 'When the car’s display reads the target, tap here.'));
    demoStep(7200, () => {
      uncoach(); setScreen('freetogo');
      demoStep(1600, () => coach('#resumeBtn', 'Unplug promptly (idle fees!) and resume the trip.'));
      demoStep(4600, () => { uncoach(); startLeg(S.legIndex + 1); demoIntrip(); });
    });
  } else if (S.screen === 'arrival') {
    demoStep(900, () => coach('#checkinCard', 'Last thing: one-tap check-in — Worked / Occupied / Broken — keeps every driver’s plan honest.'));
    demoStep(7500, () => stopDemo());
  }
}

function chartSvg(p) {
  // viewBox 358x134; y(soc) = 122 - soc*1.04 (80% cap -> 38.8, 15% floor -> 106.4)
  const W = 358, y = (soc) => 122 - soc * 1.04, x = (km) => km / p.distance_km * W;
  const nodes = [{km: 0, soc: p.start_soc}];
  p.stops.forEach(st => { nodes.push({km: st.offset_km, soc: st.arrive_soc, stop: true});
                          nodes.push({km: st.offset_km, soc: st.depart_soc}); });
  nodes.push({km: p.distance_km, soc: p.arrive_soc, end: true});
  const path = nodes.map((n, i) => `${i ? 'L' : 'M'}${x(n.km).toFixed(1)},${y(n.soc).toFixed(1)}`).join(' ');
  const dots = nodes.filter(n => n.stop).map(n =>
    `<circle cx="${x(n.km).toFixed(1)}" cy="${y(n.soc).toFixed(1)}" r="4.5" fill="#F0A400" stroke="#201D18" stroke-width="1.5"/>`).join('');
  return `
  <svg viewBox="0 0 358 134" style="display:block;width:100%;margin-top:5px">
    <rect x="0" y="106.4" width="358" height="15.6" fill="rgba(186,58,36,.07)"/>
    <line x1="0" y1="106.4" x2="358" y2="106.4" stroke="rgba(186,58,36,.35)" stroke-width="1" stroke-dasharray="2 3"/>
    <text x="4" y="117" font-family="Instrument Sans" font-size="8.5" fill="rgba(186,58,36,.7)">15% safety floor</text>
    <line x1="0" y1="38.8" x2="358" y2="38.8" stroke="rgba(32,29,24,.3)" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="354" y="34" text-anchor="end" font-family="Instrument Sans" font-size="8.5" fill="rgba(32,29,24,.5)">80% cap</text>
    <path d="${path} L358,122 L0,122 Z" fill="rgba(240,164,0,.14)" stroke="none"/>
    <path d="${path}" stroke="#F0A400" stroke-width="2.5" fill="none" stroke-linejoin="round" style="stroke-dasharray:700;animation:bz-draw 1.1s cubic-bezier(.4,0,.2,1) .3s both"/>
    <circle cx="0" cy="${y(p.start_soc).toFixed(1)}" r="4" fill="#201D18"/>${dots}
    <circle cx="356" cy="${y(p.arrive_soc).toFixed(1)}" r="4" fill="#2C7A4B"/>
  </svg>
  <div style="height:6px"></div>`;
}

function stopCard(st, i, p) {
  const departMs = Date.now() + p.drive_min * (st.offset_km / p.distance_km) * 60000
    + p.stops.slice(0, i).reduce((a, s) => a + s.charge_min, 0) * 60000;
  const verified = st.last_verified ? new Date(st.last_verified) : null;
  const days = verified ? Math.round((Date.now() - verified) / 86400000) : null;
  const rel = Math.round(st.trust * 100);
  const relColor = st.trust >= .6 ? 'var(--green-strong)' : 'var(--amber-dark)';
  const relDot = st.trust >= .6 ? 'var(--green)' : 'var(--amber)';
  return `
  <div class="card" id="stop${i}" style="border-radius:18px;padding:13px 15px">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div style="display:flex;align-items:center;gap:10px;min-width:0">
        <span style="flex:none;width:24px;height:24px;border-radius:8px;background:var(--amber);display:flex;align-items:center;justify-content:center;font:800 12px 'Archivo',sans-serif">${i+1}</span>
        <div style="display:flex;flex-direction:column;min-width:0">
          <span style="font:700 14px 'Instrument Sans',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${st.name}</span>
          <span style="font:400 11px 'Instrument Sans',sans-serif;color:rgba(32,29,24,.5)">${st.offset_km} km in · ${fmtClock(new Date(departMs))}${st.detour_km >= 1 ? ` · ${st.detour_km} km off route` : ''}</span>
        </div>
      </div>
      <span class="tabnum" style="flex:none;padding:4px 9px;border-radius:999px;background:rgba(32,29,24,.06);font:700 12px 'Archivo',sans-serif">${st.arrive_soc}%</span>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding:9px 12px;background:rgba(240,164,0,.1);border-radius:12px">
      <span class="tabnum" style="font:800 16px 'Archivo',sans-serif">${st.arrive_soc}% → ${st.depart_soc}%</span>
      <span style="font:800 16px 'Archivo',sans-serif;color:var(--amber-dark)">${st.charge_min} min</span>
    </div>
    <div style="display:flex;align-items:center;gap:6px;margin-top:8px">
      <span style="width:7px;height:7px;border-radius:50%;background:${relDot}"></span>
      <span style="font:600 11px 'Instrument Sans',sans-serif;color:${relColor}">${rel}% reliability score${days !== null ? ` · verified ${days === 0 ? 'today' : days + ' days ago'}` : ' · never verified'}${st.kw_is_assumed ? ' · power assumed' : ` · ${Math.round(st.dc_kw)} kW`}</span>
    </div>
    ${st.plan_b ? `<div style="margin-top:9px;padding-top:9px;border-top:1px dashed rgba(32,29,24,.15);font:400 11px 'Instrument Sans',sans-serif;color:rgba(32,29,24,.55)"><span style="font-weight:700;color:var(--ink)">Plan B</span> — ${st.plan_b.name}, ${Math.abs(st.plan_b.offset_km - st.offset_km)} km ${st.plan_b.offset_km >= st.offset_km ? 'ahead' : 'back'}. ${Math.round(st.plan_b.dc_kw)} kW · reliability ${Math.round(st.plan_b.trust*100)}%.</div>` : ''}
    <div onclick="toggleSwap(${i})" style="margin-top:9px;padding-top:9px;border-top:1px solid rgba(32,29,24,.08);display:flex;justify-content:space-between;align-items:center;cursor:pointer">
      <span style="font:600 12px 'Instrument Sans',sans-serif;color:var(--amber-dark)">Change this charger</span>
      <span style="font:600 11px 'Instrument Sans',sans-serif;color:rgba(32,29,24,.4)">${S.swapOpen === i ? '▲' : `${(st.alternatives || []).length} nearby ▼`}</span>
    </div>
    ${S.swapOpen === i ? swapPanel(st, i) : ''}
  </div>`;
}

function swapPanel(st, i) {
  const alts = st.alternatives || [];
  if (!alts.length) return `<div style="margin-top:8px;font:400 11.5px 'Instrument Sans',sans-serif;color:rgba(32,29,24,.5)">No other fast charger within 30 km of this stop.</div>`;
  return `<div style="margin-top:8px;display:flex;flex-direction:column;gap:6px">
    ${alts.map(a => `
    <div onclick="swapStop(${i},${a.charger_id})" style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 11px;border:1px solid rgba(32,29,24,.12);border-radius:12px;cursor:pointer;background:var(--bg);opacity:${S.swapBusy ? .5 : 1}">
      <div style="display:flex;flex-direction:column;min-width:0">
        <span style="font:600 12.5px 'Instrument Sans',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${a.name}</span>
        <span style="font:400 10.5px 'Instrument Sans',sans-serif;color:rgba(32,29,24,.5)">${a.offset_km} km in${a.detour_km >= 1 ? ` · ${a.detour_km} km off route` : ''} · ${a.kw_is_assumed ? 'power assumed' : Math.round(a.dc_kw) + ' kW'} · reliability ${Math.round(a.trust * 100)}%</span>
      </div>
      <span style="flex:none;font:700 11px 'Instrument Sans',sans-serif;color:var(--amber-dark)">${S.swapBusy ? '…' : 'Pick'}</span>
    </div>`).join('')}
  </div>`;
}

function itineraryScreen() {
  const p = S.plan;
  const arrive = new Date(Date.now() + p.total_min * 60000);
  const margin = p.arrive_soc >= 15 ? 'comfortable margin' : 'tight — drive gently';
  const pillBg = p.arrive_soc >= 15 ? 'var(--green-tint)' : 'rgba(240,164,0,.14)';
  const pillBorder = p.arrive_soc >= 15 ? 'rgba(44,122,75,.25)' : 'rgba(240,164,0,.5)';
  const pillColor = p.arrive_soc >= 15 ? 'var(--green-strong)' : 'var(--amber-dark)';
  const minSoc = Math.min(p.arrive_soc, ...p.stops.map(s => s.arrive_soc));
  // place_id values go in the *_place_id param — Maps can't parse "place_id:…" as text
  const gmParam = (sel, role) => {
    const v = sel.value || sel.label;
    return v.startsWith('place_id:')
      ? `${role}=${encodeURIComponent(sel.label)}&${role}_place_id=${v.slice(9)}`
      : `${role}=${encodeURIComponent(v)}`;
  };
  const mapsUrl = `https://www.google.com/maps/dir/?api=1&${gmParam(S.from, 'origin')}&${gmParam(S.to, 'destination')}&waypoints=${p.stops.map(s => s.lat + ',' + s.lon).join('|')}`;
  const tab = (label, on, active) => active
    ? `<span style="padding:7px 13px;border-radius:999px;font:600 12px 'Instrument Sans',sans-serif;background:var(--ink);color:var(--bg)">${label}</span>`
    : `<span style="padding:7px 13px;border-radius:999px;font:500 12px 'Instrument Sans',sans-serif;border:1px solid rgba(32,29,24,.15);color:rgba(32,29,24,.35)">${label} <span style="font-size:9px;letter-spacing:.06em">SOON</span></span>`;
  return `
  <div class="screen" style="background:var(--bg)">
    <div style="flex:1;overflow-y:auto;padding:20px 0 130px">
      <div class="rise" style="padding:0 22px">
        <div style="margin-left:46px;min-height:38px;display:flex;align-items:center;font:600 12px 'Instrument Sans',sans-serif;color:rgba(32,29,24,.55)">
          ${(S.from.label||'Start').split(/[—,]/)[0].trim()} → ${(S.to.label||'').split(',')[0]} · ${Math.round(p.distance_km)} km
        </div>
        <div id="arriveBig" style="display:flex;align-items:flex-end;justify-content:space-between;margin-top:8px">
          <div style="display:flex;flex-direction:column">
            <span class="eyebrow" style="font-size:10px">Arrive</span>
            <span class="tabnum" style="font:800 36px/1 'Archivo',sans-serif;letter-spacing:-1px">${fmtClock(arrive)}</span>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:3px;padding-bottom:2px">
            <span style="display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:${pillBg};border:1px solid ${pillBorder}">
              <span style="width:7px;height:7px;border-radius:50%;background:${p.arrive_soc >= 15 ? 'var(--green)' : 'var(--amber)'}"></span>
              <span style="font:700 13.5px 'Archivo',sans-serif;color:${pillColor}">${p.arrive_soc}% on arrival</span>
            </span>
            <span style="font:500 10.5px 'Instrument Sans',sans-serif;color:${pillColor}">${margin}</span>
          </div>
        </div>
        <div style="margin-top:5px;font:400 12px 'Instrument Sans',sans-serif;color:rgba(32,29,24,.55)">${fmtDur(p.total_min)} total — ${fmtDur(p.drive_min)} driving · ${p.charge_min} min charging · ${p.stops.length} stop${p.stops.length === 1 ? '' : 's'}</div>
        <div style="display:flex;gap:6px;margin-top:11px">${tab('Fastest', null, true)}${tab('Cheapest')}${tab('Fewest stops')}</div>
      </div>
      <div class="rise" style="animation-delay:.08s;margin:12px 18px 0;padding:12px 14px 8px;background:var(--card);border:1px solid var(--hair);border-radius:18px">
        <div style="display:flex;justify-content:space-between;align-items:baseline">
          <span class="eyebrow">Battery over the trip</span>
          <span style="font:400 10px 'Instrument Sans',sans-serif;color:rgba(32,29,24,.4)">never below ${minSoc}%</span>
        </div>
        ${chartSvg(p)}
      </div>
      <div class="rise" style="animation-delay:.16s;display:flex;flex-direction:column;gap:10px;padding:10px 18px 0">
        ${S.swapError ? `<div style="padding:10px 13px;border-radius:12px;background:rgba(186,58,36,.08);border:1px solid rgba(186,58,36,.3);font:500 12px 'Instrument Sans',sans-serif;color:#BA3A24">${S.swapError}</div>` : ''}
        ${S.pinned ? `<div style="display:flex;justify-content:space-between;align-items:center;padding:0 4px">
          <span style="font:600 11px 'Instrument Sans',sans-serif;color:var(--amber-dark)">Stops customized by you</span>
          <span onclick="replanWith(null)" style="font:600 11px 'Instrument Sans',sans-serif;color:rgba(32,29,24,.55);text-decoration:underline;cursor:pointer">Reset to fastest plan</span>
        </div>` : ''}
        ${p.stops.map((st, i) => stopCard(st, i, p)).join('')}
        ${p.warnings && p.warnings.length ? `<div style="font:400 11px 'Instrument Sans',sans-serif;color:rgba(32,29,24,.5);padding:0 4px">⚠ ${p.warnings.join(' · ')}</div>` : ''}
      </div>
    </div>
    <div style="position:absolute;left:0;right:0;bottom:0;padding:30px 18px calc(24px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(247,243,236,0),var(--bg) 40%)">
      <div style="display:flex;gap:10px">
        <div id="startTripBtn" class="btn" style="flex:1;height:54px;background:var(--ink)" onclick="startLeg(0)"><span style="font:800 16px 'Archivo',sans-serif;color:var(--amber)">Start trip</span></div>
        <a class="btn" style="height:54px;padding:0 16px;border-radius:16px;border:1.5px solid rgba(32,29,24,.2);background:var(--bg);text-decoration:none" href="${mapsUrl}" target="_blank"><span style="font:600 13px 'Instrument Sans',sans-serif;color:var(--ink)">Send to Maps ↗</span></a>
      </div>
    </div>
  </div>`;
}

function intripScreen() {
  const leg = S.legs[S.legIndex];
  const dotX = ((leg.cum + Math.min(S.kmDone || 0, leg.km)) / S.plan.distance_km * 358).toFixed(1);
  const dotY = (64 - (S.socNow || leg.startSoc) * 0.525).toFixed(1);
  return `
  <div class="screen" style="background:var(--dark);color:var(--ondark)">
    <div style="position:absolute;inset:0;background:var(--amber);animation:bz-flashout .5s ease .12s both;pointer-events:none;z-index:5"></div>
    <div class="drop" style="animation-delay:.3s;display:flex;align-items:center;justify-content:center;gap:8px;margin:16px 24px 0 62px;padding:9px;border-radius:999px;background:rgba(245,239,227,.06)">
      <span style="width:8px;height:8px;border-radius:50%;background:var(--green-dark)"></span>
      <span style="font:600 12.5px 'Instrument Sans',sans-serif;color:var(--green-dark)">On plan</span>
      <span style="font:400 12.5px 'Instrument Sans',sans-serif;color:rgba(245,239,227,.55)">· leg ${S.legIndex + 1} of ${S.legs.length} · left at ${Math.round(leg.startSoc)}%</span>
    </div>
    <div style="padding:30px 24px 0;text-align:center">
      <span class="eyebrow-d">Next stop</span>
      <div style="font:800 31px/1.15 'Archivo',sans-serif;letter-spacing:-.5px;margin-top:6px">${leg.name}</div>
      <div class="tabnum" style="display:flex;justify-content:center;gap:22px;margin-top:10px;font:600 20px 'Archivo',sans-serif;color:rgba(245,239,227,.85)">
        <span id="liveKm">${Math.round(S.kmLeft)} km</span><span style="color:rgba(245,239,227,.35)">·</span><span id="liveEta">${fmtDur(S.kmLeft / 85 * 60)}</span>
      </div>
      <div id="liveLine" style="margin-top:8px;font:500 11.5px 'Instrument Sans',sans-serif;color:rgba(245,239,227,.5)">${tripLiveText()}</div>
    </div>
    <div class="pop" style="animation-delay:.45s;text-align:center;margin-top:34px">
      <span class="eyebrow-d">You'll arrive with</span>
      <div class="tabnum" style="font:900 112px/1 'Archivo',sans-serif;letter-spacing:-4px;color:var(--amber)">${leg.arrive}<span style="font-size:58px;letter-spacing:-1px">%</span></div>
      <span style="display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:5px 12px;border-radius:999px;background:rgba(143,217,168,.12);border:1px solid rgba(143,217,168,.3);font:600 12px 'Instrument Sans',sans-serif;color:var(--green-dark)">planned</span>
    </div>
    <div style="margin:32px 24px 0">
      <svg viewBox="0 0 358 74" style="display:block;width:100%">
        <rect x="0" y="61" width="358" height="9" fill="rgba(186,90,70,.15)"/>
        <line x1="0" y1="22" x2="358" y2="22" stroke="rgba(245,239,227,.18)" stroke-width="1" stroke-dasharray="4 4"/>
        <path d="${ribbonPath()}" stroke="rgba(245,239,227,.28)" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <circle id="tripDot" cx="${dotX}" cy="${dotY}" r="6" fill="#F0A400" stroke="#14110B" stroke-width="2.5"/>
      </svg>
      <div style="text-align:center;margin-top:10px;font:400 10.5px 'Instrument Sans',sans-serif;color:rgba(245,239,227,.35)">battery over the whole trip · you are at the dot</div>
    </div>
    <div style="margin-top:auto;padding:16px 24px calc(30px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px">
      <a class="btn" style="height:60px;border-radius:18px;background:var(--amber);box-shadow:0 10px 28px -10px rgba(240,164,0,.55);text-decoration:none" href="${leg.lat ? `https://www.google.com/maps/dir/?api=1&destination=${leg.lat},${leg.lon}` : '#'}" target="_blank">
        <svg width="18" height="18" viewBox="0 0 18 18"><path d="M9 1 L17 17 L9 13 L1 17 Z" fill="#201D18"/></svg>
        <span style="font:800 18px 'Archivo',sans-serif;color:var(--ink)">Navigate</span>
      </a>
      <div id="arrivedBtn" class="btn" style="height:52px;border-radius:16px;border:1.5px solid rgba(245,239,227,.25);background:rgba(245,239,227,.06)" onclick="arrivedAtLegEnd()">
        <span style="font:700 14px 'Instrument Sans',sans-serif;color:var(--ondark)">${leg.final ? "I've arrived — finish trip" : "I've plugged in at the charger"}</span>
      </div>
      ${leg.planB ? `<div style="text-align:center;font:500 12px 'Instrument Sans',sans-serif;color:rgba(245,239,227,.5)">Charger down? <span style="color:var(--amber);font-weight:600">Plan B — ${leg.planB}</span></div>` : ''}
    </div>
  </div>`;
}
function ribbonPath() {
  // whole-trip SoC in faint stroke; y(soc) = 64 - soc*0.525
  const p = S.plan, W = 358, y = (s) => 64 - s * 0.525, x = (km) => km / p.distance_km * W;
  const nodes = [{km: 0, soc: p.start_soc}];
  p.stops.forEach(st => { nodes.push({km: st.offset_km, soc: st.arrive_soc}); nodes.push({km: st.offset_km, soc: st.depart_soc}); });
  nodes.push({km: p.distance_km, soc: p.arrive_soc});
  return nodes.map((n, i) => `${i ? 'L' : 'M'}${x(n.km).toFixed(1)},${y(n.soc).toFixed(1)}`).join(' ');
}
function chargingScreen() {
  const stop = S.stops[S.legIndex];
  return `
  <div class="screen" style="background:var(--dark);color:var(--ondark)">

        <span style="animation:bz-charge 1.6s ease-in-out infinite;display:inline-flex">${BOLT(11,14,'#F0A400')}</span>
        <span style="font:600 12.5px 'Instrument Sans',sans-serif;color:var(--amber)">Charging · ${stop.name.split('—')[0].trim()}${stop.operator ? ' · ' + stop.operator : ''}</span>
      </span>
    </div>
    <div id="chargeTarget" class="pop" style="animation-delay:.15s;text-align:center;margin-top:44px">

      <div style="margin-top:10px;font:600 15.5px 'Instrument Sans',sans-serif;color:rgba(245,239,227,.7)">from ~${stop.arrive_soc}% · <span style="color:var(--amber)">about ${stop.charge_min} min at ${Math.round(Math.min(stop.dc_kw, S.vehicle.max_dc_kw))} kW</span></div>

        <div style="position:absolute;top:16px;left:${stop.arrive_soc}%;width:${stop.depart_soc - stop.arrive_soc}%;height:10px;background:rgba(240,164,0,.28)"></div>

        <span style="position:absolute;top:37px;left:${stop.depart_soc}%;transform:translateX(-50%);font:700 10.5px 'Archivo',sans-serif;color:var(--ondark);white-space:nowrap">${stop.depart_soc} — free to go</span>
        <span style="position:absolute;top:0;left:0;font:500 10.5px 'Instrument Sans',sans-serif;color:rgba(245,239,227,.4)">0</span>

      </div>
      <div style="text-align:center;margin-top:14px;font:400 10.5px 'Instrument Sans',sans-serif;color:rgba(245,239,227,.35)">watch the car's display — tap below when it reads ${stop.depart_soc}%</div>
    </div>
    <div style="margin:26px 24px 0;padding:14px 16px;border-radius:14px;background:rgba(245,239,227,.05);border:1px solid var(--hair-d);font:400 13px/1.55 'Instrument Sans',sans-serif;color:rgba(245,239,227,.75)">
      Stop at <span style="color:var(--amber);font-weight:700">${stop.depart_soc}%</span>. Charging slows sharply past 80% — stopping at target keeps you on the fastest plan, and unplugging promptly avoids idle fees.
    </div>
    <div style="margin-top:auto;padding:16px 24px calc(30px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px">
      <div id="chargeDone" class="btn" style="height:58px;border-radius:18px;background:var(--amber);box-shadow:0 10px 28px -10px rgba(240,164,0,.55)" onclick="setScreen('freetogo')">
        <span style="font:800 17px 'Archivo',sans-serif;color:var(--ink)">Reached ${stop.depart_soc}% — I'm done</span>
      </div>
      <div style="text-align:center;font:500 12px 'Instrument Sans',sans-serif;color:rgba(245,239,227,.45)">Need more range later? <span style="color:rgba(245,239,227,.75);font-weight:600">Charge past 80%</span></div>
    </div>
  </div>`;
}

function freetogoScreen() {
  const stop = S.stops[S.legIndex];
  const next = S.legs[S.legIndex + 1];
  return `
  <div class="screen" style="background:var(--dark);color:var(--ondark)">
    <div class="drop" style="animation-delay:.1s;margin:18px 16px 0 62px;display:flex;gap:12px;align-items:center;padding:13px 15px;border-radius:20px;background:rgba(245,239,227,.1);border:1px solid rgba(245,239,227,.14)">
      ${HEX_LOGO(34)}
      <div style="display:flex;flex-direction:column;gap:1px;min-width:0">
        <div style="display:flex;justify-content:space-between;gap:8px"><span style="font:700 13px 'Instrument Sans',sans-serif">Buzzinga</span><span style="font:400 11px 'Instrument Sans',sans-serif;color:rgba(245,239,227,.5)">now</span></div>
        <span style="font:400 12.5px/1.4 'Instrument Sans',sans-serif;color:rgba(245,239,227,.8)">${stop.depart_soc}% reached — you're free to go. Unplugging now avoids idle fees.</span>
      </div>
    </div>
    <div style="text-align:center;margin-top:56px">
      <div class="pop" style="animation-delay:.35s;display:inline-flex;align-items:center;justify-content:center;width:88px;height:88px;border-radius:50%;background:rgba(143,217,168,.12);border:2px solid rgba(143,217,168,.4)">
        <svg width="38" height="30" viewBox="0 0 18 14"><path d="M1 7 L6.5 12.5 L17 1.5" stroke="#8FD9A8" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg>
      </div>
      <div class="tabnum" style="margin-top:22px;font:900 88px/1 'Archivo',sans-serif;letter-spacing:-3px;color:var(--green-dark)">${stop.depart_soc}<span style="font-size:46px">%</span></div>
      <div style="margin-top:14px;font:800 24px 'Archivo',sans-serif;letter-spacing:-.4px">You're free to go.</div>
      <div style="margin-top:8px;font:400 13.5px 'Instrument Sans',sans-serif;color:rgba(245,239,227,.6)">Charged ${stop.arrive_soc} → ${stop.depart_soc}% in ${stop.charge_min} min — right on plan.</div>
    </div>
    ${next ? `<div style="margin:32px 24px 0;padding:13px 16px;border-radius:14px;background:rgba(245,239,227,.05);border:1px solid var(--hair-d);text-align:center;font:400 12.5px 'Instrument Sans',sans-serif;color:rgba(245,239,227,.65)">Next leg: ${next.name}, ${Math.round(next.km)} km · you'll arrive with ${next.arrive}%</div>` : ''}
    <div style="margin-top:auto;padding:16px 24px calc(30px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px">
      <div id="resumeBtn" class="btn" style="height:62px;border-radius:18px;background:var(--amber);box-shadow:0 10px 28px -10px rgba(240,164,0,.55)" onclick="startLeg(${S.legIndex + 1})">
        <span style="font:800 18px 'Archivo',sans-serif;color:var(--ink)">I've unplugged — resume trip</span>
      </div>
      <div style="text-align:center;font:500 12px 'Instrument Sans',sans-serif;color:rgba(245,239,227,.5)">Need more range later? <span style="color:rgba(245,239,227,.75);font-weight:600">Keep charging past 80%</span></div>
    </div>
  </div>`;
}

function arrivalScreen() {
  const p = S.plan;
  const lastStop = S.stops[S.stops.length - 1];
  const kwh = S.stops.reduce((a, s) => a + (s.depart_soc - s.arrive_soc) / 100 * S.vehicle.usable_kwh, 0);
  const cost = Math.round(kwh * 21);
  const destName = (S.to.label || '').split(',')[0];
  return `
  <div class="screen" style="background:var(--bg)">
    <div style="flex:1;overflow-y:auto;padding-bottom:20px">
      <div class="rise" style="padding:60px 22px 0">
        <span class="eyebrow" style="font-size:10px;letter-spacing:.14em">Trip complete</span>
        <div style="font:800 30px/1.1 'Archivo',sans-serif;letter-spacing:-.5px;margin-top:4px">You made it to ${destName}.</div>
        <div style="display:flex;gap:10px;margin-top:16px">
          <div style="flex:1;padding:13px;border-radius:16px;background:var(--green-tint);border:1px solid rgba(44,122,75,.25)">
            <span class="eyebrow" style="color:var(--green-strong);letter-spacing:.1em">Arrival battery</span>
            <div style="display:flex;align-items:baseline;gap:7px;margin-top:2px">
              <span class="tabnum" style="font:800 29px 'Archivo',sans-serif;color:var(--green-strong)">${p.arrive_soc}%</span>
              <span style="font:500 11px 'Instrument Sans',sans-serif;color:var(--green)">as planned</span>
            </div>
          </div>
          <div style="flex:1;padding:13px" class="card">
            <span class="eyebrow" style="letter-spacing:.1em">Arrived</span>
            <div style="display:flex;align-items:baseline;gap:7px;margin-top:2px">
              <span class="tabnum" style="font:800 29px 'Archivo',sans-serif">${fmtClock(new Date())}</span>
              <span style="font:500 11px 'Instrument Sans',sans-serif;color:rgba(32,29,24,.5)">on plan</span>
            </div>
          </div>
        </div>
        <div style="margin-top:8px;font:500 12px 'Instrument Sans',sans-serif;color:var(--green)">Right on the plan — that's the whole promise.</div>
      </div>
      ${lastStop ? `
      <div id="checkinCard" class="pop" style="animation-delay:.18s;margin:16px 16px 0;padding:16px;background:var(--ink);border-radius:20px">
        <div style="font:700 15px 'Instrument Sans',sans-serif;color:var(--ondark)">Before you forget — did ${lastStop.name.split('—')[0].trim()} work?</div>
        <div style="font:400 11.5px 'Instrument Sans',sans-serif;color:rgba(245,239,227,.55);margin-top:3px">One tap. It keeps the next driver's plan honest.</div>
        ${!S.checkin ? `
        <div style="display:flex;gap:8px;margin-top:14px">
          <div class="btn" style="flex:1.2;flex-direction:column;gap:4px;padding:14px 0;border-radius:14px;background:var(--green-dark)" onclick="sendCheckin('success','Worked')">
            <svg width="18" height="14" viewBox="0 0 18 14"><path d="M1 7 L6.5 12.5 L17 1.5" stroke="#14110B" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
            <span style="font:800 13px 'Archivo',sans-serif;color:#14110B">Worked</span>
          </div>
          <div class="btn" style="flex:1;flex-direction:column;gap:4px;padding:14px 0;border-radius:14px;border:1.5px solid rgba(240,164,0,.6);background:none" onclick="sendCheckin('occupied','Occupied')">
            <svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" stroke="#F0A400" stroke-width="2" fill="none"/><path d="M8 4.5 L8 8.5 L11 10" stroke="#F0A400" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
            <span style="font:700 13px 'Archivo',sans-serif;color:var(--amber)">Occupied</span>
          </div>
          <div class="btn" style="flex:1;flex-direction:column;gap:4px;padding:14px 0;border-radius:14px;border:1.5px solid rgba(224,106,84,.55);background:none" onclick="sendCheckin('failure','Broken')">
            <svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 2 L12 12 M12 2 L2 12" stroke="#E06A54" stroke-width="2.4" stroke-linecap="round"/></svg>
            <span style="font:700 13px 'Archivo',sans-serif;color:var(--red-dark)">Broken</span>
          </div>
        </div>` : `
        <div class="pop" style="display:flex;align-items:center;gap:10px;margin-top:14px;padding:15px 16px;border-radius:14px;background:rgba(143,217,168,.14);border:1px solid rgba(143,217,168,.35)">
          <svg width="16" height="13" viewBox="0 0 18 14"><path d="M1 7 L6.5 12.5 L17 1.5" stroke="#8FD9A8" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
          <span style="font:600 13px 'Instrument Sans',sans-serif;color:var(--green-dark)">Logged "${S.checkin}" — thanks. ${S.checkinTrust !== null ? `Reliability score is now ${Math.round(S.checkinTrust*100)}%.` : 'This keeps reliability scores honest.'}</span>
        </div>`}
      </div>` : ''}
      <div style="display:flex;gap:10px;padding:14px 16px 0">
        <div class="card" style="flex:1;padding:12px 10px;border-radius:14px;text-align:center">
          <div class="tabnum" style="font:800 16px 'Archivo',sans-serif">${fmtDur(p.total_min)}</div>
          <div style="font:400 10.5px 'Instrument Sans',sans-serif;color:rgba(32,29,24,.5)">total time</div>
        </div>
        <div class="card" style="flex:1;padding:12px 10px;border-radius:14px;text-align:center">
          <div class="tabnum" style="font:800 16px 'Archivo',sans-serif">${kwh.toFixed(0)} kWh</div>
          <div style="font:400 10.5px 'Instrument Sans',sans-serif;color:rgba(32,29,24,.5)">charged</div>
        </div>
        <div class="card" style="flex:1;padding:12px 10px;border-radius:14px;text-align:center">
          <div class="tabnum" style="font:800 16px 'Archivo',sans-serif">₹${cost.toLocaleString('en-IN')}</div>
          <div style="font:400 10.5px 'Instrument Sans',sans-serif;color:rgba(32,29,24,.5)">charging est.</div>
        </div>
      </div>
    </div>
    <div style="padding:16px 16px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px">
      <div class="btn btn-amber" style="height:54px" onclick="saveRoute();setScreen('home2')"><span style="font:800 15px 'Archivo',sans-serif;color:var(--ink)">Done</span></div>
    </div>
  </div>`;
}
function saveRoute() {
  S.saved = {
    from: S.from, to: S.to, distance_km: S.plan.distance_km,
    stops: S.plan.stops.length, arrive_soc: S.plan.arrive_soc,
    checkedIn: !!S.checkin, lastCharger: S.stops.length ? S.stops[S.stops.length-1].name.split('—')[0].trim() : null,
  };
  localStorage.setItem('bz_saved', JSON.stringify(S.saved));
}

function home2Screen() {
  const sv = S.saved;
  return `
  <div class="screen" style="background:var(--bg);padding-top:0">
    ${mapArea()}
    <div class="rise" style="position:relative;margin-top:-20px;z-index:6;background:var(--bg);border-radius:22px 22px 0 0;padding:16px 22px 0;box-shadow:0 -8px 24px -12px rgba(32,29,24,.18);flex-shrink:0">
      <div class="card" style="display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer" onclick="setScreen('home')">
        <svg width="15" height="15" viewBox="0 0 15 15"><circle cx="6.5" cy="6.5" r="5" stroke="rgba(32,29,24,.45)" stroke-width="2" fill="none"/><path d="M10.5 10.5 L14.5 14.5" stroke="rgba(32,29,24,.45)" stroke-width="2"/></svg>
        <span style="font:500 15px 'Instrument Sans',sans-serif;color:rgba(32,29,24,.45)">Where to?</span>
      </div>
      ${sv ? `
      <span class="eyebrow" style="display:block;margin:16px 0 8px">Saved route</span>
      <div class="card" style="padding:14px 16px">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <span style="font:700 15px 'Instrument Sans',sans-serif">${(sv.from.label||'Start').split(/[—,]/)[0].trim()} → ${(sv.to.label||'').split(',')[0]}</span>
          <span style="font:600 12px 'Instrument Sans',sans-serif;color:var(--amber-dark);cursor:pointer" onclick="S.to=S.saved.to;setScreen('home')">Plan again</span>
        </div>
        <div style="margin-top:4px;font:400 11.5px 'Instrument Sans',sans-serif;color:rgba(32,29,24,.55)">${Math.round(sv.distance_km)} km · ${sv.stops} stop${sv.stops === 1 ? '' : 's'} · last trip arrived with ${sv.arrive_soc}% — right on plan</div>
      </div>` : ''}
      ${sv && sv.checkedIn ? `
      <div style="margin-top:12px;padding:14px 16px;border-radius:16px;background:rgba(240,164,0,.12);border:1px solid rgba(240,164,0,.4)">
        <div style="display:flex;align-items:center;gap:8px">
          ${BOLT(14,17,'#8A5B00')}
          <span style="font:700 13px 'Instrument Sans',sans-serif;color:#4A3A10">Your check-in is working</span>
        </div>
        <div style="margin-top:4px;font:400 11.5px/1.5 'Instrument Sans',sans-serif;color:#4A3A10">${sv.lastCharger}'s reliability score updated the moment you tapped — every driver planning this corridor sees it.</div>
      </div>` : ''}
      <div style="text-align:center;margin:16px 0 calc(30px + env(safe-area-inset-bottom));font:400 11.5px 'Instrument Sans',sans-serif;color:rgba(32,29,24,.45)">Next long trip? Plan it the night before — it takes 20 seconds.</div>
    </div>
  </div>`;
}

/* ---------- vehicle picker ---------- */
function openVehiclePicker() {
  const m = document.createElement('div');
  m.id = 'modal';
  m.onclick = (e) => { if (e.target.id === 'modal') m.remove(); };
  m.innerHTML = `
  <div class="sheet">
    <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px">
      <span style="font:800 19px 'Archivo',sans-serif">Your vehicle</span>
      <span style="font:400 11.5px 'Instrument Sans',sans-serif;color:rgba(32,29,24,.5)">${S.vehicles.length} EVs</span>
    </div>
    <input class="field" placeholder="Search make or model…" style="padding:12px 14px;border:1px solid var(--hair);border-radius:14px;background:var(--card);margin-bottom:10px"
      oninput="filterVehicles(this.value)">
    <div id="vlist" style="overflow-y:auto"></div>
  </div>`;
  app.appendChild(m);
  filterVehicles('');
}
function filterVehicles(q) {
  q = q.toLowerCase();
  const list = S.vehicles.filter(v => (v.make + ' ' + v.model + ' ' + (v.variant||'')).toLowerCase().includes(q)).slice(0, 60);
  $('vlist').innerHTML = list.map(v => `
    <div class="vrow" onclick='pickVehicle("${v.id}")'>
      <div style="display:flex;flex-direction:column;gap:1px;min-width:0">
        <span style="font:600 14px 'Instrument Sans',sans-serif">${v.make} ${v.model}</span>
        <span style="font:400 11px 'Instrument Sans',sans-serif;color:rgba(32,29,24,.55)">${v.variant || ''} · ${v.usable_kwh} kWh usable · ${Math.round(v.max_dc_kw)} kW DC${v.highway_wh_per_km ? ` · ~${Math.round(v.usable_kwh / v.highway_wh_per_km * 1000)} km full charge` : ''}</span>
      </div>
      <span class="badge ${v.tier === 1 ? 'badge-t1' : 'badge-t2'}">${v.tier === 1 ? 'MEASURED' : 'ESTIMATED'}</span>
    </div>`).join('') || '<div style="text-align:center;padding:20px;color:rgba(32,29,24,.5);font-size:13px">No match</div>';
}
function pickVehicle(id) {
  S.vehicle = S.vehicles.find(v => v.id === id);
  localStorage.setItem('bz_vehicle', id);
  const m = $('modal'); if (m) m.remove();
  render();
}

/* ---------- back navigation ---------- */
// fixed targets, not a history stack: trip screens return to the itinerary
// (always renderable from S.plan) — a stack could pop into a screen whose
// legIndex state has since moved on
const BACK_TO = { itinerary: 'home', intrip: 'itinerary', charging: 'itinerary',
                  freetogo: 'itinerary', arrival: 'itinerary' };
function goBack() {
  if (S.demo) stopDemo(false);            // taking control ends the demo script
  if (BACK_TO[S.screen]) setScreen(BACK_TO[S.screen], false);
}
function backBtn() {
  const dark = ['intrip', 'charging', 'freetogo'].includes(S.screen);
  return `<div onclick="goBack()" role="button" aria-label="Back" title="Back"
    style="position:absolute;top:calc(14px + env(safe-area-inset-top));left:16px;z-index:98;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;background:${dark ? 'rgba(245,239,227,.12)' : 'rgba(32,29,24,.08)'}">
    <svg width="16" height="16" viewBox="0 0 16 16"><path d="M10 2 L4 8 L10 14" stroke="${dark ? '#F5EFE3' : '#201D18'}" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`;
}
const BACK_SCREENS = ['itinerary', 'intrip', 'charging', 'freetogo', 'arrival'];

/* ---------- render loop ---------- */
function render() {
  const screens = {
    splash: splashScreen, home: homeScreen, itinerary: itineraryScreen,
    intrip: intripScreen, charging: chargingScreen, freetogo: freetogoScreen,
    arrival: arrivalScreen, home2: home2Screen,
  };
  app.innerHTML = screens[S.screen]()
    + (BACK_SCREENS.includes(S.screen) ? backBtn() : '')
    + (S.demo ? `<div onclick="stopDemo()" style="position:absolute;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));z-index:99;display:flex;align-items:center;gap:7px;padding:8px 15px;border-radius:999px;background:var(--ink);color:var(--bg);font:600 12px 'Instrument Sans',sans-serif;box-shadow:0 8px 24px -8px rgba(32,29,24,.5);cursor:pointer">▶ Demo walkthrough — tap to exit</div>` : '');
  clearTimeout(tmMap);
  if (S.screen === 'home' || S.screen === 'home2') mountMap();
  setLocBtn(watchId !== null);
}

loadVehicles();
locate();
render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>

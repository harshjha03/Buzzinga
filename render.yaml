# Render blueprint — free-tier setup: web service only.
# DB lives on Neon (free, PostGIS); 6-hourly OCM sync runs as a GitHub Action.
# Free tier spins down after ~15 min idle (~50 s cold start on next visit).
services:
  - type: web
    name: buzzinga
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        sync: false            # paste the Neon connection string in the dashboard
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: GOOGLE_ROUTES_API_KEY
        sync: false
      - key: OCM_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://buzzinga.onrender.com"
